<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
  >

  <title>INC Atlas Buzzer</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <main class="app">

    <section
      id="joinView"
      class="card"
    >

      <div class="eyebrow">
        INC ATLAS PRESENTS
      </div>

      <h1>BUZZER</h1>

      <p>
        Join the live round.
      </p>

      <input
        id="roomCode"
        maxlength="10"
        placeholder="ROOM CODE"
      >

      <input
        id="playerName"
        maxlength="40"
        placeholder="YOUR NAME"
      >

      <button id="joinBtn">
        JOIN ROOM
      </button>

      <div
        id="joinError"
        class="error"
      ></div>

    </section>


    <section
      id="gameView"
      class="hidden"
    >

      <header>

        <div>

          <div class="eyebrow">
            INC ATLAS PRESENTS
          </div>

          <h1>BUZZER</h1>

        </div>

        <div class="status">

          <span id="connectionDot"></span>

          <span id="connectionText">
            CONNECTING
          </span>

        </div>

      </header>


      <div class="grid">

        <section class="card">

          <div class="round">
            ROUND
            <span id="roundNumber">
              0
            </span>
          </div>

          <div id="roundState">
            WAITING
          </div>

          <button
            id="buzzBtn"
            disabled
          >
            BUZZ!
          </button>

          <div id="result"></div>

        </section>


        <section class="card">

          <h2>
            Players
          </h2>

          <div id="players"></div>

        </section>

      </div>


      <section class="card controls">

        <button id="startBtn">
          START ROUND
        </button>

        <button id="nextBtn">
          NEXT ROUND
        </button>

        <div class="sync">
          Latency:
          <b id="latency">
            --
          </b>
          ms
        </div>

      </section>

    </section>

  </main>


  <script
    src="/socket.io/socket.io.js"
  ></script>

  <script
    src="/app.js"
  ></script>

</body>

</html>
